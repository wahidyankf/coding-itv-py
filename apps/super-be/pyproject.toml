[project]
name = "super-be"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["super_be", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
