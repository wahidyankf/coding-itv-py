[project]
name = "super-cli"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.25.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["super_cli"]
python_files = ["*_tests.py"]
addopts = "--ignore-glob=*_production_tests.py"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["super_cli"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
